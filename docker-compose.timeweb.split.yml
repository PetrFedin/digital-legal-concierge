services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  app:
    container_name: legal-concierge
    environment:
      RUNTIME_ROLE: web
      RUN_BOT: "false"
      RUN_SCHEDULER: "true"
    networks:
      - default
      - proxy

  bot:
    image: "${APP_IMAGE_REPOSITORY:-digital-legal-concierge}:${APP_IMAGE_TAG:-timeweb}"
    container_name: legal-concierge-bot
    env_file:
      - .env
    environment:
      RUNTIME_ROLE: bot
      RUN_BOT: "true"
      RUN_SCHEDULER: "false"
      DATABASE_URL: "${BOT_DATABASE_URL:?BOT_DATABASE_URL is required for the host-network Telegram worker}"
      REDIS_URL: "${BOT_REDIS_URL:?BOT_REDIS_URL is required for the host-network Telegram worker}"
    network_mode: host
    extra_hosts:
      api.telegram.org: "${TELEGRAM_API_IPV6:?TELEGRAM_API_IPV6 is required on Timeweb while Telegram IPv4 is unreachable}"
    volumes:
      - concierge_data:/app/data
      - concierge_storage:/app/storage
      - concierge_logs:/app/logs
      - concierge_backups:/app/backups
    restart: unless-stopped
    stop_grace_period: 45s
    entrypoint:
      - python
      - -m
      - app.bot.worker
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  proxy:
    external: true
