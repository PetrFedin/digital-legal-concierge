name: Apply v44 transition fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/retention-legal-hold-secure-deletion
          fetch-depth: 0

      - name: Apply verified fix
        shell: bash
        run: |
          set -euo pipefail
          echo "3b8cf142e699aecf4f43c09e7480d97015ccf2b95ea6bf97a8375608674cb9d0  .agent-fix-v44.patch" | sha256sum --check --strict
          git apply --check .agent-fix-v44.patch
          git apply .agent-fix-v44.patch
          rm .agent-fix-v44.patch
          python -m compileall -q app/domain/cases/case_service.py tests/test_case_transitions.py
          git add -A
          git diff --cached --check
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "fix: preserve tombstone transition compatibility"
          git push origin HEAD:agent/retention-legal-hold-secure-deletion
