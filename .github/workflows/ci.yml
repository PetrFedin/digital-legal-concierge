name: CI

on:
  push:
    branches: [main, feature/multi-role-access]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build temporary source snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -print | LC_ALL=C sort > repository-manifest.txt
          tar --exclude=.git --exclude=.venv --exclude='*.pyc' --exclude='__pycache__' -czf /tmp/repository-source.tar.gz .
          mv /tmp/repository-source.tar.gz repository-source.tar.gz

      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-source-retention-base
          path: |
            repository-manifest.txt
            repository-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile source
        run: python -m compileall -q app scripts migrations tests

      - name: Run architecture quality gate
        run: python scripts/architecture_check.py

      - name: Initialize database through Alembic
        run: |
          rm -f ci_test.db migration_smoke.db
          python scripts/init_db.py
          python scripts/migrate_db.py

      - name: Verify current revision and idempotency
        run: |
          alembic current
          alembic upgrade head

      - name: Verify ORM schema matches migrations
        run: alembic check

      - name: Verify clean database migration smoke test
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head

      - name: Run tests
        run: pytest -q
