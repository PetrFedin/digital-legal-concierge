name: Apply retention v44 files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-retention-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/retention-legal-hold-secure-deletion
          fetch-depth: 0

      - name: Verify and install v44 files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          80f97e9c6311f87603bbb0b483d6a0f4380f83a1490af6ee4553a85319b5d8b6  .agent-patch/part-00
          87e361cceb82be0a632ba647d7b3a7dcfdc7f827d8e22d3c7361580375ab20c3  .agent-patch/chunk-01
          20cb636a437e60acb5a0f8aa24642c72a22a4eabccd3ac2c792739a77f0c41a4  .agent-patch/chunk-02
          63098e67041ec7be09b4218773e7527f5386e3246cd6f98cad9a02b3999038e4  .agent-patch/chunk-03
          d08b75558450f9e548baad7a3ec21f3f19de0600687a755e9d3650c8ded27f83  .agent-patch/chunk-04
          6be8c3b9da6af4fce5b63cbbd26b2fd7e1264ddce51ef69ce4c89b6a9bdfdabc  .agent-patch/chunk-05
          6bfdd66db1fb746a209501ed0140f54266e9424b17f42182a4158946e1a5433a  .agent-patch/chunk-06
          EOF
          sha256sum --check --strict /tmp/chunks.sha256

          cat \
            .agent-patch/part-00 \
            .agent-patch/chunk-01 \
            .agent-patch/chunk-02 \
            .agent-patch/chunk-03 \
            .agent-patch/chunk-04 \
            .agent-patch/chunk-05 \
            .agent-patch/chunk-06 \
            > /tmp/retention-files.tar.gz.b64
          base64 --decode /tmp/retention-files.tar.gz.b64 > /tmp/retention-files.tar.gz
          echo "d6e206dea2092514bf0cb9da8537e93dd0fadcdfab3c134a92e01bd6a7e46702  /tmp/retention-files.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/retention-files.tar.gz
          tar -tzf /tmp/retention-files.tar.gz > /tmp/retention-files.list
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$))' /tmp/retention-files.list; then
            echo "Unsafe archive path" >&2
            exit 1
          fi
          tar -xzf /tmp/retention-files.tar.gz
          rm -rf .agent-patch

          python -m compileall -q app scripts migrations tests
          git add -A
          git diff --cached --check

          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "feat: add controlled case retention and legal hold"
          git push origin HEAD:agent/retention-legal-hold-secure-deletion
