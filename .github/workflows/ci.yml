name: Apply final v44 test fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/retention-legal-hold-secure-deletion
          fetch-depth: 0

      - name: Apply verified test fix
        shell: bash
        run: |
          set -euo pipefail
          echo "c02043ebb8626bc3e414bac1b888d0f170e2dcb008fba0ecfd8edca4eefdab98  .agent-fix-v44-2.patch" | sha256sum --check --strict
          git apply --check .agent-fix-v44-2.patch
          git apply .agent-fix-v44-2.patch
          rm .agent-fix-v44-2.patch
          python -m compileall -q tests/test_case_transitions.py
          git add -A
          git diff --cached --check
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "test: fix tombstone transition fixture"
          git push origin HEAD:agent/retention-legal-hold-secure-deletion
