name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  sqlite-tests:
    name: SQLite application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile source
        run: python -m compileall -q app scripts migrations tests

      - name: Run architecture quality gate
        run: python scripts/architecture_check.py

      - name: Initialize database through Alembic
        run: |
          rm -f ci_test.db migration_smoke.db
          python scripts/init_db.py
          python scripts/migrate_db.py

      - name: Verify current revision and idempotency
        run: |
          alembic current
          alembic upgrade head

      - name: Verify ORM schema matches migrations
        run: alembic check

      - name: Verify clean database migration smoke test
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head

      - name: Run tests
        run: pytest -q

  postgres-migrations:
    name: PostgreSQL migration, schema and backup gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: concierge_ci
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://concierge:concierge-ci-password@localhost:5432/concierge_ci
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
      BACKUP_ENCRYPTION_KEY_ID: ci-postgresql-backup-key
      BACKUP_ENCRYPTION_KEY: ci-postgresql-backup-key-012345678901234567890123456789
      BACKUP_DIR: /tmp/concierge-backups
      STORAGE_DIR: /tmp/concierge-storage
      MAX_BACKUP_MB: "100"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and PostgreSQL client
        run: |
          pip install -e ".[test]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply all migrations
        run: alembic upgrade head

      - name: Verify current revision and idempotency
        run: |
          alembic current
          alembic upgrade head

      - name: Verify PostgreSQL ORM schema matches migrations
        run: alembic check

      - name: Create, verify and extract encrypted PostgreSQL backup
        run: |
          rm -rf "$BACKUP_DIR" "$STORAGE_DIR" /tmp/concierge-restore
          mkdir -p "$STORAGE_DIR"
          printf 'postgresql backup integration\n' > "$STORAGE_DIR/integration.txt"
          python -m app.security.backup_cli create \
            --database-url "$DATABASE_URL" \
            --storage-dir "$STORAGE_DIR" \
            --backup-dir "$BACKUP_DIR" | tee /tmp/backup-create.json
          archive=$(python -c 'import json; print(json.load(open("/tmp/backup-create.json"))["path"])')
          test -f "$archive"
          python -m app.security.backup_cli verify "$archive" | tee /tmp/backup-verify.json
          python -m app.security.backup_cli extract "$archive" /tmp/concierge-restore
          ARCHIVE="$archive" python - <<'PY'
          import json
          import os
          from pathlib import Path

          created = json.loads(Path("/tmp/backup-create.json").read_text())
          verified = json.loads(Path("/tmp/backup-verify.json").read_text())
          manifest = json.loads(
              Path("/tmp/concierge-restore/manifest.json").read_text()
          )
          assert created["ok"] is True and created["verified"] is True
          assert verified["ok"] is True and verified["verified"] is True
          assert Path(os.environ["ARCHIVE"]).suffix == ".dlcbak"
          assert manifest["database"] == {
              "engine": "postgresql",
              "file": "database/database.dump",
              "format": "pg_dump_custom",
          }
          assert (
              Path("/tmp/concierge-restore/storage/integration.txt").read_text()
              == "postgresql backup integration\n"
          )
          PY
          pg_restore --list /tmp/concierge-restore/database/database.dump >/dev/null
          test -z "$(find "$BACKUP_DIR" -type f \( -name '*.dump' -o -name '.pgpass' -o -name '*.tar.gz' \) -print -quit)"

  container-smoke:
    name: Container build and startup gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag digital-legal-concierge:ci .

      - name: Verify image migration and backup tooling
        run: |
          docker run --rm --entrypoint sh digital-legal-concierge:ci -c '
            test -f /app/alembic.ini
            test -d /app/migrations/versions
            test -f /app/scripts/init_db.py
            pg_dump --version
          '

      - name: Start container through production command and verify health
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:////tmp/container_smoke.db
          BOT_TOKEN: CHANGE_ME
          RUN_BOT: "false"
          RUN_SCHEDULER: "false"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin-change-me
          ADMIN_API_TOKEN: ci-admin-token-change-me
        run: |
          container_id=$(docker run -d \
            --name concierge-container-smoke \
            -p 127.0.0.1:18080:8000 \
            -e APP_ENV \
            -e DATABASE_URL \
            -e BOT_TOKEN \
            -e RUN_BOT \
            -e RUN_SCHEDULER \
            -e ADMIN_USERNAME \
            -e ADMIN_PASSWORD \
            -e ADMIN_API_TOKEN \
            digital-legal-concierge:ci)
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id" | grep -qx true; then
              echo "Container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Container did not become healthy within 45 seconds" >&2
          exit 1
