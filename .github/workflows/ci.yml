name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  process-map-contract:
    name: Process map maintenance contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full history for change inventory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify living process map exists
        run: test -s docs/PROCESS_MAP_CURRENT.md

      - name: Require process map update in every pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Fxq 'docs/PROCESS_MAP_CURRENT.md'; then
            echo "::error::Every pull request must update docs/PROCESS_MAP_CURRENT.md so the living process/debt/change map stays current."
            exit 1
          fi

          latest_map_commit=$(
            git rev-list -1 "$BASE_SHA..$HEAD_SHA" -- docs/PROCESS_MAP_CURRENT.md
          )
          latest_governed_commit=$(
            git rev-list -1 "$BASE_SHA..$HEAD_SHA" -- . ':(exclude)docs/PROCESS_MAP_CURRENT.md'
          )

          if [ -z "$latest_map_commit" ]; then
            echo "::error::Unable to resolve a process-map update in the pull-request range."
            exit 1
          fi

          if [ -n "$latest_governed_commit" ] && ! git merge-base --is-ancestor "$latest_governed_commit" "$latest_map_commit"; then
            echo "::error::docs/PROCESS_MAP_CURRENT.md is stale: repository changes were committed after its latest update. Update the living map after the latest governed change."
            echo "latest governed commit: $latest_governed_commit"
            echo "latest process-map commit: $latest_map_commit"
            exit 1
          fi

          echo "Process map freshness contract satisfied."
          echo "latest governed commit: ${latest_governed_commit:-none}"
          echo "latest process-map commit: $latest_map_commit"

  pm018-authority-proof:
    name: PM-018 authority and M2 handoff proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./pm018_ci.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile PM-018 sources and proofs
        run: |
          python -m compileall -q \
            app/domain/cases/case_service.py \
            app/domain/consultations/outcome_service.py \
            app/models/case.py \
            app/models/case_transition.py \
            migrations/versions/20260918_0024_case_transition_authority_recovery.py \
            tests/test_case_transition_authority_pm018.py \
            tests/test_m2_to_m1_authority_pm018.py

      - name: Prove migration 0024 and ORM parity
        run: |
          rm -f pm018_ci.db
          alembic upgrade head
          alembic current
          alembic check

      - name: Run PM-018 regression and negative proof
        run: |
          pytest -q \
            tests/test_case_transition_authority_pm018.py \
            tests/test_m2_to_m1_authority_pm018.py

  pm019-projection-proof:
    name: PM-019 My Case projection proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./pm019_ci.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile PM-019 projection and proof
        run: |
          python -m compileall -q \
            app/bot/client_case_view.py \
            app/bot/screens/my_case.py \
            app/bot/screens/common.py \
            app/domain/cases/case_activity.py \
            tests/test_pm019_my_case_projection.py

      - name: Run PM-019 deterministic projection proof
        run: pytest -q tests/test_pm019_my_case_projection.py

  pm016-rule-editor-proof:
    name: PM-016 v2 legal rule editor proof
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./pm016_ci.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile PM-016 v2 sources and proofs
        run: |
          python -m compileall -q \
            app/domain/calculator/rule_engine.py \
            app/domain/calculator/rule_revision_service.py \
            app/domain/calculator/calculator_service.py \
            app/domain/calculator/intake_service.py \
            app/domain/calculator/calculator_result_formatter.py \
            app/api/calculator_builder.py \
            app/api/workdesk_calculator_projection.py \
            app/api/workdesk_calculator_ui_patch.py \
            app/bot/screens/calculator.py \
            migrations/versions/20260924_0025_calculator_rule_v2_legal_review.py \
            tests/test_calculator_rule_engine_v2.py \
            tests/test_calculator_staff_surfaces_v38.py \
            tests/test_calculator_durable_intake_v38.py \
            tests/test_telegram_calculator_recovery_flow.py

      - name: Prove migration 0025 and ORM parity
        run: |
          rm -f pm016_ci.db
          alembic upgrade head
          alembic current
          alembic check

      - name: Run PM-016 v2 bounded regression proof
        run: |
          pytest -q \
            tests/test_calculator_rule_engine_v2.py \
            tests/test_calculator_rule_engine_v38.py \
            tests/test_calculator_staff_surfaces_v38.py \
            tests/test_calculator_durable_intake_v38.py \
            tests/test_calculator_durable_write_order_v38.py \
            tests/test_calculator_finalize_idempotency_v38.py \
            tests/test_telegram_calculator_recovery_flow.py
  sqlite-tests:
    name: SQLite application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Compile source
        run: python -m compileall -q app scripts migrations tests

      - name: Run architecture quality gate
        run: python scripts/architecture_check.py

      - name: Initialize database through Alembic
        run: |
          rm -f ci_test.db migration_smoke.db
          python scripts/init_db.py
          python scripts/migrate_db.py

      - name: Verify current revision and idempotency
        run: |
          alembic current
          alembic upgrade head

      - name: Verify ORM schema matches migrations
        run: alembic check

      - name: Verify clean database migration smoke test
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./migration_smoke.db alembic upgrade head

      - name: Run tests
        run: pytest -q

  postgres-migrations:
    name: PostgreSQL migration, backup and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: concierge_ci
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://concierge:concierge-ci-password@localhost:5432/concierge_ci
      STAGING_DATABASE_URL: postgresql+asyncpg://concierge:concierge-ci-password@localhost:5432/concierge_restore
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
      BACKUP_ENCRYPTION_KEY_ID: ci-postgresql-backup-key
      BACKUP_ENCRYPTION_KEY: ci-postgresql-backup-key-012345678901234567890123456789
      BACKUP_DIR: /tmp/concierge-backups
      STORAGE_DIR: /tmp/concierge-storage
      MAX_BACKUP_MB: "100"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and PostgreSQL client
        run: |
          pip install -e ".[test]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply all migrations
        run: alembic upgrade head

      - name: Verify current revision and idempotency
        run: |
          alembic current
          alembic upgrade head

      - name: Verify PostgreSQL ORM schema matches migrations
        run: alembic check

      - name: Verify PostgreSQL scheduler singleton lease
        run: |
          python - <<'PY'
          import asyncio

          from app.db.session import engine
          from app.scheduler.lease import SchedulerCycleLease

          async def main():
              first = SchedulerCycleLease()
              second = SchedulerCycleLease()
              assert await first.acquire() is True
              await first.assert_held()
              assert await second.acquire() is False
              await first.release()
              assert await second.acquire() is True
              await second.assert_held()
              await second.release()
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Seed disaster recovery probe
        run: |
          export PGPASSWORD=concierge-ci-password
          psql --host=localhost --port=5432 --username=concierge --dbname=concierge_ci \
            --no-password --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE backup_restore_probe (
            id text PRIMARY KEY,
            payload text NOT NULL
          );
          INSERT INTO backup_restore_probe(id, payload)
          VALUES ('drill-20260731', 'verified-data-roundtrip');
          SQL
          unset PGPASSWORD

      - name: Create and verify encrypted PostgreSQL backup
        run: |
          rm -rf "$BACKUP_DIR" "$STORAGE_DIR" /tmp/concierge-restore
          mkdir -p "$STORAGE_DIR"
          printf 'postgresql backup integration\n' > "$STORAGE_DIR/integration.txt"
          python -m app.security.backup_cli create \
            --database-url "$DATABASE_URL" \
            --storage-dir "$STORAGE_DIR" \
            --backup-dir "$BACKUP_DIR" | tee /tmp/backup-create.json
          archive=$(python -c 'import json; print(json.load(open("/tmp/backup-create.json"))["path"])')
          test -f "$archive"
          python -m app.security.backup_cli verify "$archive" | tee /tmp/backup-verify.json
          printf '%s\n' "$archive" > /tmp/backup-archive-path

      - name: Restore into an empty staging database
        run: |
          export PGPASSWORD=concierge-ci-password
          createdb --host=localhost --port=5432 --username=concierge \
            --no-password concierge_restore
          unset PGPASSWORD
          archive=$(cat /tmp/backup-archive-path)
          python -m app.security.backup_cli restore-postgresql-staging \
            "$archive" /tmp/concierge-restore \
            --confirm-database concierge_restore | tee /tmp/backup-restore.json

      - name: Verify restored data, storage and schema
        run: |
          export PGPASSWORD=concierge-ci-password
          probe=$(psql --host=localhost --port=5432 --username=concierge \
            --dbname=concierge_restore --no-password --tuples-only --no-align \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT payload FROM backup_restore_probe WHERE id='drill-20260731';")
          test "$probe" = "verified-data-roundtrip"
          psql --host=localhost --port=5432 --username=concierge \
            --dbname=concierge_restore --no-password --set=ON_ERROR_STOP=1 \
            --command="DROP TABLE backup_restore_probe;"
          unset PGPASSWORD
          python - <<'PY'
          import json
          from pathlib import Path

          created = json.loads(Path("/tmp/backup-create.json").read_text())
          verified = json.loads(Path("/tmp/backup-verify.json").read_text())
          restored = json.loads(Path("/tmp/backup-restore.json").read_text())
          manifest = json.loads(
              Path("/tmp/concierge-restore/manifest.json").read_text()
          )
          assert created["ok"] is True and created["verified"] is True
          assert verified["ok"] is True and verified["verified"] is True
          assert restored["ok"] is True and restored["verified"] is True
          assert restored["database"] == "concierge_restore"
          assert restored["schema_current"] is True
          assert restored["restored_revision"] == restored["expected_revision"]
          assert restored["restored_relations"] > 0
          assert manifest["database"] == {
              "engine": "postgresql",
              "file": "database/database.dump",
              "format": "pg_dump_custom",
          }
          assert (
              Path("/tmp/concierge-restore/storage/integration.txt").read_text()
              == "postgresql backup integration\n"
          )
          PY
          DATABASE_URL="$STAGING_DATABASE_URL" alembic check
          test -z "$(find "$BACKUP_DIR" -type f \( -name '*.dump' -o -name '.pgpass' -o -name '*.tar.gz' \) -print -quit)"
          test -z "$(find /tmp/concierge-restore -name '.pgpass' -print -quit)"

  container-smoke:
    name: Container build and startup gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag digital-legal-concierge:ci .

      - name: Verify image migration and backup tooling
        run: |
          docker run --rm --entrypoint sh digital-legal-concierge:ci -c '
            test -f /app/alembic.ini
            test -d /app/migrations/versions
            test -f /app/scripts/init_db.py
            pg_dump --version
          '

      - name: Start container through production command and verify health
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:////tmp/container_smoke.db
          BOT_TOKEN: CHANGE_ME
          RUN_BOT: "false"
          RUN_SCHEDULER: "false"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin-change-me
          ADMIN_API_TOKEN: ci-admin-token-change-me
        run: |
          container_id=$(docker run -d \
            --name concierge-container-smoke \
            -p 127.0.0.1:18080:8000 \
            -e APP_ENV \
            -e DATABASE_URL \
            -e BOT_TOKEN \
            -e RUN_BOT \
            -e RUN_SCHEDULER \
            -e ADMIN_USERNAME \
            -e ADMIN_PASSWORD \
            -e ADMIN_API_TOKEN \
            digital-legal-concierge:ci)
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id" | grep -qx true; then
              echo "Container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Container did not become healthy within 45 seconds" >&2
          exit 1
