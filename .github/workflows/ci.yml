name: Apply retention v44 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-retention-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/retention-legal-hold-secure-deletion
          fetch-depth: 0

      - name: Verify and apply retained patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent-patch/retention-v44.patch.gz.b64 > /tmp/retention-v44.patch.gz
          gzip --test /tmp/retention-v44.patch.gz
          gzip --decompress --stdout /tmp/retention-v44.patch.gz > /tmp/retention-v44.patch
          git apply --check --exclude=.github/workflows/ci.yml /tmp/retention-v44.patch
          git apply --exclude=.github/workflows/ci.yml /tmp/retention-v44.patch
          rm -rf .agent-patch

          python -m compileall -q app scripts migrations tests
          git add -A
          git diff --cached --check

          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "feat: add controlled case retention and legal hold"
          git push origin HEAD:agent/retention-legal-hold-secure-deletion
