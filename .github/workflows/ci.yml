name: Apply retention v44 files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-retention-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/retention-legal-hold-secure-deletion
          fetch-depth: 0

      - name: Verify and install v44 files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-patch/part-00 \
            .agent-patch/chunk-01 \
            .agent-patch/chunk-02 \
            .agent-patch/chunk-03 \
            .agent-patch/chunk-04 \
            .agent-patch/chunk-05 \
            .agent-patch/chunk-06 \
            > /tmp/retention-files.tar.gz.b64
          base64 --decode /tmp/retention-files.tar.gz.b64 > /tmp/retention-files.tar.gz
          echo "d6e206dea2092514bf0cb9da8537e93dd0fadcdfab3c134a92e01bd6a7e46702  /tmp/retention-files.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/retention-files.tar.gz
          tar -tzf /tmp/retention-files.tar.gz > /tmp/retention-files.list
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$))' /tmp/retention-files.list; then
            echo "Unsafe archive path" >&2
            exit 1
          fi
          tar -xzf /tmp/retention-files.tar.gz
          rm -rf .agent-patch

          python -m compileall -q app scripts migrations tests
          git add -A
          git diff --cached --check

          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "feat: add controlled case retention and legal hold"
          git push origin HEAD:agent/retention-legal-hold-secure-deletion
