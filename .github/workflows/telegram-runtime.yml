name: Telegram Runtime Contracts

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telegram-runtime-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  redis-fsm-runtime:
    name: Redis FSM restart and Case binding
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./telegram_redis_runtime.db
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      FSM_STORAGE_BACKEND: redis
      REDIS_URL: redis://localhost:6379/15
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Apply database migrations
        run: |
          rm -f telegram_redis_runtime.db
          alembic upgrade head
          alembic check

      - name: Verify Redis-backed Telegram restart and client UX contracts
        run: pytest -q tests/test_telegram_redis_runtime.py tests/test_telegram_client_ux_pm022.py
