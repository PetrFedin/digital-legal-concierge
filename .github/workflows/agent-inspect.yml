name: Apply architecture quality patch

on:
  push:
    branches:
      - agent/state-machine-calculator-quality

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply patch atomically
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-patch/part-* > /tmp/quality.patch.gz.b64
          base64 --decode /tmp/quality.patch.gz.b64 > /tmp/quality.patch.gz
          gzip --decompress --stdout /tmp/quality.patch.gz > /tmp/quality.patch
          echo "e203b6aae1158ef1c3888a07e7adc5d3e43dd3cb7a900cdba142cd5bf1ac377e  /tmp/quality.patch" | sha256sum --check --strict

          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/agent-inspect.yml
          git apply --check /tmp/quality.patch
          git apply /tmp/quality.patch
          rm -rf .agent-patch

          python -m compileall -q app scripts migrations tests
          git add -A
          git diff --cached --check

          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.invalid"
          git commit -m "fix: enforce case state machine and reproducible calculations"
          git push origin HEAD:agent/state-machine-calculator-quality
