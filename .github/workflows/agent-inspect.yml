name: Agent repository inspection

on:
  push:
    branches:
      - agent/state-machine-calculator-quality

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -print | LC_ALL=C sort > repository-manifest.txt
          tar --exclude=.git --exclude=.venv --exclude='*.pyc' --exclude='__pycache__' -czf repository-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: |
            repository-manifest.txt
            repository-source.tar.gz
          if-no-files-found: error
          retention-days: 1
