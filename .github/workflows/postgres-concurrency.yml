name: PostgreSQL Concurrency

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: postgres-concurrency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-case-and-money-races:
    name: M1/M2 PostgreSQL race contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: concierge_concurrency
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://concierge:concierge-ci-password@localhost:5432/concierge_concurrency
      BOT_TOKEN: CHANGE_ME
      RUN_BOT: "false"
      RUN_SCHEDULER: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-change-me
      ADMIN_API_TOKEN: ci-admin-token-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Apply production schema
        run: alembic upgrade head

      - name: Verify multi-case, money, staff and assignment concurrency contracts
        run: >-
          pytest -q
          tests/test_postgres_multi_case_concurrency.py
          tests/test_postgres_payment_concurrency.py
          tests/test_postgres_refund_retry_race.py
          tests/test_postgres_staff_concurrency.py
          tests/test_postgres_auto_assignment_concurrency.py
