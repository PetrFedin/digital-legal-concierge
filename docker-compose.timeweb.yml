services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - concierge_data:/app/data
      - concierge_storage:/app/storage
      - concierge_logs:/app/logs
      - concierge_backups:/app/backups
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  concierge_data:
  concierge_storage:
  concierge_logs:
  concierge_backups:
