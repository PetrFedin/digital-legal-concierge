[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-legal-concierge-bot"
version = "1.0.0"
description = "Production legal concierge for the approved M1/M2 Telegram workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "aiogram>=3.10",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "redis>=5.0",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "pyotp>=2.9",
  "cryptography>=42",
  "qrcode[pil]>=7.4",
  "packaging>=26.2",
  "pikepdf[pdfa]>=10.16,<10.17",
  "ocrmypdf>=17.13,<17.14",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "playwright>=1.47",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["docs*", "content*", "storage*", "templates*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error",
]

[tool.ruff]
line-length = 100