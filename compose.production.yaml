services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-concierge
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./backups:/app/backups

    networks:
      - proxy
      - telegram_v6

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  proxy:
    external: true
  telegram_v6:
    external: true
